<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: inknote-img:" />
  <title>InkNote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">InkNote</span>
        </div>
        <div class="save-state" id="saveState">Saved</div>
      </div>

      <div class="sidebar-scroll">
        <div class="pane">
          <div class="pane-head">
            <span>Sections</span>
            <button class="icon-btn" id="addSection" title="New section">+</button>
          </div>
          <ul class="list" id="sectionList"></ul>
        </div>

        <div class="pane pane-pages">
          <div class="pane-head">
            <span>Pages</span>
            <button class="icon-btn" id="addPage" title="New page">+</button>
          </div>
          <ul class="list" id="pageList"></ul>
        </div>
      </div>

      <div class="sidebar-foot">
        <button class="ghost-btn" id="exportBtn">Export</button>
        <button class="ghost-btn" id="importBtn">Import</button>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main id="main">
      <header id="toolbar">
        <div class="tool-group">
          <button class="tool" data-tool="select" title="Select / move (V)">
            <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
          </button>
          <button class="tool" data-tool="card" title="Card (C)">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M7.5 10h9M7.5 14h5"/></svg>
          </button>
          <button class="tool" data-tool="row" title="Row — lays boxes side by side (R)">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14"/></svg>
          </button>
          <button class="tool" data-tool="checklist" title="Checklist (K)">
            <svg viewBox="0 0 24 24"><path d="M4 7l2 2 3.5-3.5"/><path d="M4 17l2 2 3.5-3.5"/><path d="M13 7.5h7M13 17.5h7"/></svg>
          </button>
          <button class="tool" data-tool="column" title="Column (L)">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
          </button>
          <button class="tool" data-tool="arrow" title="Arrow — click one item, then another (A)">
            <svg viewBox="0 0 24 24"><path d="M4 18L18 6"/><path d="M12 5h7v7"/></svg>
          </button>
          <button class="tool" data-tool="image" title="Image box (I)">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-6 6"/></svg>
          </button>
          <button class="tool" data-tool="field" title="Variable field (F)">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="8" height="10" rx="2"/><rect x="13" y="7" width="8" height="10" rx="2"/><path d="M6 12h2"/></svg>
          </button>
          <button class="tool" data-tool="link" title="Page link (G)">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/></svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="tool-group">
          <button class="tool" data-tool="pen" title="Pen (P)">
            <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
          </button>
          <button class="tool" data-tool="highlighter" title="Highlighter (H)">
            <svg viewBox="0 0 24 24"><path d="M6 18l3-9 7 3-4 8z"/><path d="M4 21h9"/></svg>
          </button>
          <button class="tool" data-tool="eraser" title="Eraser (E)">
            <svg viewBox="0 0 24 24"><path d="M4 16l7-7 7 7-3 3H7z"/><path d="M6 21h13"/></svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="tool-group" id="colorRow"></div>

        <div class="divider"></div>

        <div class="tool-group size-group">
          <label for="sizeRange">Size</label>
          <input type="range" id="sizeRange" min="1" max="40" value="3" />
          <span class="size-preview"><i id="sizeDot"></i></span>
        </div>

        <div class="divider"></div>

        <div class="tool-group">
          <button class="tool wide" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
          <button class="tool wide" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
        </div>

        <div class="spacer"></div>

        <div class="tool-group">
          <button class="tool" id="homeBtn" title="Back to your work (Home)">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>
          </button>
          <button class="tool wide" id="zoomOut" title="Zoom out">&minus;</button>
          <button class="tool wide" id="zoomLevel" title="Reset zoom">100%</button>
          <button class="tool wide" id="zoomIn" title="Zoom in">+</button>
        </div>
      </header>

      <div id="stage">
        <!-- canvas paints ink; overlay hosts board items; both share one transform -->
        <canvas id="ink"></canvas>
        <div id="overlay">
          <svg id="links" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 z" fill="context-stroke" />
              </marker>
            </defs>
            <g id="linkPaths"></g>
          </svg>
          <div id="items"></div>
        </div>
        <div id="linkHint" class="link-hint" hidden>Click a second item to connect &middot; Esc to cancel</div>

        <div id="blockPickBar" hidden>
          <span class="bp-text">Click a block on <b id="blockPickWhat">this page</b> to link to it &middot; drag to look around</span>
          <button type="button" id="blockPickWhole">Link the whole page</button>
          <button type="button" id="blockPickCancel">Cancel</button>
        </div>
      </div>

      <footer id="statusbar">
        <span id="pageTitleLabel"></span>
        <span id="selectionLabel" class="sel-count"></span>
        <span class="spacer"></span>
        <span id="hint">Space+drag or middle-drag to pan &middot; Ctrl+scroll to zoom &middot; <b>Home</b> to re-centre</span>
      </footer>
    </main>
  </div>

  <!-- ============ CONTEXT MENU ============ -->
  <div id="ctxMenu" hidden></div>

  <!-- ============ VARIABLE PICKER ============ -->
  <div id="varPicker" hidden>
    <input id="varPickerSearch" type="text" placeholder="Search or create a variable…" spellcheck="false" />
    <ul id="varPickerList"></ul>
  </div>

  <!-- ============ PAGE PICKER ============ -->
  <div id="pagePicker" hidden>
    <input id="pagePickerSearch" type="text" placeholder="Search pages and boxes…" spellcheck="false" />
    <ul id="pagePickerList"></ul>
  </div>

  <!-- ============ CONFIRM MODAL ============ -->
  <div id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Delete?</h2>
      <p id="modalBody"></p>
      <input id="modalInput" type="text" spellcheck="false" hidden />
      <div class="modal-actions">
        <button class="ghost-btn" id="modalCancel">Cancel</button>
        <button class="danger-btn" id="modalOk">Delete</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
